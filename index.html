<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Base SEO. Per-page values are overridden at runtime by react-helmet. -->
    <title>Hanemann Plastic Surgery | Baton Rouge, LA</title>
    <meta
      name="description"
      content="Board-certified plastic surgeon Dr. Michael Hanemann in Baton Rouge, LA. Facial, breast, body, and nose procedures with natural, refined results. Schedule a consultation."
    />
    <meta name="theme-color" content="#1a1f2e" />
    <link rel="canonical" href="https://hanemannplasticsurgery.com/" />

    <!-- Open Graph / social fallback -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hanemann Plastic Surgery" />
    <meta property="og:title" content="Hanemann Plastic Surgery | Baton Rouge, LA" />
    <meta
      property="og:description"
      content="Board-certified plastic surgeon in Baton Rouge, LA. Facial, breast, body, and nose procedures with natural, refined results."
    />
    <meta property="og:url" content="https://hanemannplasticsurgery.com/" />
    <meta property="og:image" content="https://hanemannplasticsurgery.com/images/hero/desktop/hero-slide-1.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/images/logos/logo-main.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
