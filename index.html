<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Only static, non-per-page tags live here. Title, description, canonical,
      Open Graph, and Twitter tags are owned PER PAGE by react-helmet-async
      (see components/seo/SEOHead.tsx). They were previously duplicated here,
      which produced two conflicting <link rel="canonical"> tags (and doubled
      OG tags) on every route — harmful for indexing. The <title> below is a
      pre-hydration fallback only; Helmet replaces it on every page.
    -->
    <title>Hanemann Plastic Surgery | Baton Rouge, LA</title>
    <meta name="theme-color" content="#1a1f2e" />
    <link rel="icon" type="image/png" href="/images/logos/logo-main.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
